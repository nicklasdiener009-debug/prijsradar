name: Find public offer folders (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='prijsradar-bot/1.0 (+https://github.com/nicklasdiener009-debug/prijsradar)'
          final=$(curl -s -A "$UA" -L -o /dev/null -w '%{url_effective}' "https://view.publitas.com/jumbo-supermarkten"); base="${final%/}"
          curl -s -A "$UA" "$base/spreads.json" -o spreads.json
          img=$(jq -r '.[2].pages[0].images.at1200' spreads.json); echo "img $img"
          for h in https://view.publitas.com https://view.publitas.com/p222 https://cdn.publitas.com; do echo "$h$img $(curl -s -A "$UA" -o /dev/null -w '%{http_code} %{content_type}' "$h$img")"; done
          jq -r '.[2].pages[0].text' spreads.json | head -c 1200; echo
          jq -c '.[2].pages[0].screenshots' spreads.json | cut -c1-400
          for s in dirk lidl aldi plus albert-heijn ah jumbo ekoplaza dekamarkt spar hoogvliet vomar poiesz nettorama; do
            echo "folders.nl/$s $(curl -s -A "$UA" -L -o /dev/null -w '%{http_code} %{url_effective}' "https://view.folders.nl/$s")"
          done
          echo "ah $(curl -s -A "$UA" -L -o /dev/null -w '%{http_code} %{url_effective}' https://folder.ah.nl/)"
