name: Find public offer folders (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='prijsradar-bot/1.0 (+https://github.com/nicklasdiener009-debug/prijsradar)'
          for g in jumbo-supermarkten vomar; do
            final=$(curl -s -A "$UA" -L -o /dev/null -w '%{url_effective}' "https://view.publitas.com/$g"); base="${final%/}"
            curl -s -A "$UA" "$base/data.json" -o data.json; curl -s -A "$UA" "$base/spreads.json" -o spreads.json
            echo "=== $g"; jq -c 'del(.sizes) | to_entries | map(select(.value|type!="object" and type!="array")) | from_entries' data.json | cut -c1-900
            jq -c 'keys' data.json
            jq -c '.[0] | keys' spreads.json; jq -c '.[1].pages[0] | keys' spreads.json
            jq -c '[.[].pages[].hotspots // [] | length] | add' spreads.json
            jq -c '[.[].pages[].hotspots[]?] | .[0:3]' spreads.json | cut -c1-2500
          done
