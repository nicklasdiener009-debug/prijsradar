name: Find public offer folders (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='prijsradar-bot/1.0 (+https://github.com/nicklasdiener009-debug/prijsradar)'
          for g in jumbo-supermarkten vomar dekamarkt ekoplaza spar hoogvliet lidl-nederland; do
            final=$(curl -s -A "$UA" -L -o p.html -w '%{url_effective}' "https://view.publitas.com/$g")
            echo "=== $g -> $final ($(wc -c < p.html) bytes)"
            grep -oE '"[^"]*\.json[^"]*"' p.html | sort -u | head -8
            grep -oE '(hotspot|product)[A-Za-z_]*' p.html | sort | uniq -c | sort -rn | head -5
            base="${final%/page/*}"; base="${base%/}"
            for e in spreads.json hotspots_data.json pages.json data.json; do
              c=$(curl -s -A "$UA" -o j.txt -w '%{http_code}' "$base/$e"); echo "  $e $c $(wc -c < j.txt) $(head -c 300 j.txt | tr '\n' ' ')"
            done
          done
