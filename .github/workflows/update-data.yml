name: Update offers and stores

# Every morning at 06:15 Amsterdam time, so new weekly offers
# (AH and Lidl on Monday, Jumbo and Dirk on Wednesday) show up the day they start.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch offers
        id: offers
        run: node scripts/fetch-offers.mjs
        continue-on-error: true
      - name: Fetch store locations
        run: node scripts/fetch-stores.mjs
      - name: Save changes
        run: |
          git config user.name "prijsradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Update offers and stores" && git push)
      - name: Flag a problem
        if: steps.offers.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label offers-broken --state open --json number --jq '.[0].number' > n.txt
          if [ -s n.txt ]; then gh issue comment "$(cat n.txt)" --body "Still failing on $(date -u +%F). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
          else gh label create offers-broken --color d93f0b --force; gh issue create --label offers-broken --title "Offer update failed" --body "Every chain failed on $(date -u +%F). The site keeps showing the last good offers. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
      - name: Publish site
        if: always()
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
