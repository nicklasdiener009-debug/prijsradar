name: Update product photos

# Weekly on Sunday night; products and photos change slowly.
on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shop photos
        run: node scripts/fetch-shop-images.mjs
        continue-on-error: true
      - name: Match photos to products
        run: node scripts/fetch-images.mjs
      - name: Save changes
        run: |
          git config user.name "prijsradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Update product photos" && git pull --rebase -q && git push)
      - run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
